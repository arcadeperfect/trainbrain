[package]
name = "trainbrain-model"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The model railway layout: track pieces, libraries, geometry, snapping, heights, topology, checks, the schematic. No UI."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"
web-time = "1"
