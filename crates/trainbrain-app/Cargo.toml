[package]
name = "trainbrain-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The layout editor: plan, schematic and 3D views over trainbrain-model, on imfram, with an MCP server."

[[bin]]
name = "trainbrain"
path = "src/main.rs"

[dependencies]
trainbrain-model = { path = "../trainbrain-model" }
imfram = { git = "https://github.com/arcadeperfect/imfram", branch = "main" }
egui = "0.36"
wgpu = "30"
winit = "0.30"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
