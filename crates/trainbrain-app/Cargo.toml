[package]
name = "trainbrain-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The layout editor: plan, schematic and 3D views over trainbrain-model, on imfram, with an MCP server."

[[bin]]
name = "trainbrain"
path = "src/main.rs"

[dependencies]
trainbrain-model = { path = "../trainbrain-model" }
imfram = { git = "https://github.com/arcadeperfect/imfram", branch = "main" }
egui = "0.36"
wgpu = "30"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
env_logger = "0.11"
tiny_http = "0.12"

# The web build (tools/web.sh): the app in a page, on eframe's canvas.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Storage", "Location"] }
console_error_panic_hook = "0.1"
