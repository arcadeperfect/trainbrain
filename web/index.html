<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>trainbrain</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1b1d; }
  canvas#layout { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9a9aa0; font: 15px/1.4 -apple-system, system-ui, sans-serif; text-align: center; padding: 16px; }
</style>
</head>
<body>
<canvas id="layout"></canvas>
<div id="loading">loading the layout…</div>
<script type="module">
  import init from "./layout.js";
  init().catch((e) => {
    document.getElementById("loading").textContent = "Sorry: the app could not load (" + e + ").";
  });
</script>
</body>
</html>
